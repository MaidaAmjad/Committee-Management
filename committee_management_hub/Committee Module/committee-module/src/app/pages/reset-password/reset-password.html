<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="tc-page">
  <div class="tc-logo">
    <div class="tc-logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:26px;height:26px;fill:white;position:relative;z-index:1;">
        <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6L12 2zm-1 13l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/>
      </svg>
    </div>
    <span class="tc-logo-name">TrustCom</span>
  </div>

  <div class="tc-card">
    <div class="tc-card-header">
      <h1 class="tc-card-title">Set new password</h1>
      <p class="tc-card-sub">Choose a strong password for your account.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="tc-form">
      <div class="tc-field">
        <label class="tc-label" for="newPassword">New Password</label>
        <div class="tc-input-wrap">
          <input id="newPassword" [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword" name="newPassword"
            placeholder="At least 8 characters" class="tc-input" style="padding-right:48px"/>
          <button type="button" (click)="togglePassword()" class="tc-eye-btn">
            <span class="material-symbols-outlined" style="font-size:20px">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <div class="tc-field">
        <label class="tc-label" for="confirmPassword">Confirm Password</label>
        <div class="tc-input-wrap">
          <input id="confirmPassword" [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword" name="confirmPassword"
            placeholder="Repeat password" class="tc-input"/>
        </div>
        @if (confirmPassword && newPassword !== confirmPassword) {
          <p class="tc-hint tc-hint-err">Passwords do not match</p>
        }
      </div>

      @if (errorMessage()) {
        <div class="tc-alert tc-alert-err">
          <span class="material-symbols-outlined" style="font-size:18px">error</span>
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="tc-alert" style="background:#d4edda;border-color:#28a745;color:#155724;">
          <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
          {{ successMessage() }}
        </div>
      }

      <button type="submit" class="tc-btn" [disabled]="loading() || !isValid">
        @if (loading()) { Updating... } @else { Update Password }
      </button>
    </form>

    <div class="tc-signin-row" style="margin-top:20px;">
      <a [routerLink]="['/login']">Back to Sign In</a>
    </div>
  </div>
</div>
