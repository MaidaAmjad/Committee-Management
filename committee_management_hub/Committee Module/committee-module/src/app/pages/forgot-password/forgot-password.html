<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="tc-page">
  <div class="tc-logo">
    <div class="tc-logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:26px;height:26px;fill:white;position:relative;z-index:1;">
        <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6L12 2zm-1 13l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/>
      </svg>
    </div>
    <span class="tc-logo-name">TrustCom</span>
  </div>

  <div class="tc-card">
    <div class="tc-card-header">
      <h1 class="tc-card-title">Forgot password</h1>
      <p class="tc-card-sub">Enter your email and we will send a reset link.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="tc-form">
      <div class="tc-field">
        <label class="tc-label" for="email">Email Address</label>
        <input id="email" type="email" [(ngModel)]="email" name="email"
          placeholder="name@organization.com" autocomplete="email" required
          class="tc-input"
          [class.tc-valid]="emailValid"
          [class.tc-invalid]="email.length > 0 && !emailValid"/>
      </div>

      @if (successMessage()) {
        <div class="tc-alert tc-alert-ok">{{ successMessage() }}</div>
      }

      @if (errorMessage()) {
        <div class="tc-alert tc-alert-err">
          <span class="material-symbols-outlined" style="font-size:18px">error</span>
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="tc-btn" [disabled]="loading() || !emailValid">
        @if (loading()) { Sending... } @else { Send reset link → }
      </button>
    </form>

    <div class="tc-signin-row" style="margin-top:20px;">
      <a [routerLink]="['/login']">Back to Sign In</a>
    </div>
  </div>
</div>
