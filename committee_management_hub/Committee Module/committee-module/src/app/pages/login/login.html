<!-- Floating orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="tc-page">

  <!-- Logo -->
  <div class="tc-logo">
    <div class="tc-logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:26px;height:26px;fill:white;position:relative;z-index:1;">
        <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6L12 2zm-1 13l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/>
      </svg>
    </div>
    <span class="tc-logo-name">TrustCom</span>
  </div>

  <!-- Card -->
  <div class="tc-card">
    <div class="tc-card-header">
      <h1 class="tc-card-title">Welcome back</h1>
      <p class="tc-card-sub">Secure access to your committee portal.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="tc-form">

      <!-- Email -->
      <div class="tc-field">
        <label class="tc-label" for="email">Email Address</label>
        <div class="tc-input-wrap">
          <input id="email" type="email" [(ngModel)]="email" name="email"
            placeholder="name@organization.com" autocomplete="email"
            class="tc-input"/>
        </div>
      </div>

      <!-- Password -->
      <div class="tc-field">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <label class="tc-label" for="password" style="margin-bottom:0">Password</label>
          <a [routerLink]="['/forgot-password']" class="tc-forgot">Forgot password?</a>
        </div>
        <div class="tc-input-wrap">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password" name="password"
            placeholder="••••••••" autocomplete="current-password"
            class="tc-input" style="padding-right:48px"/>
          <button type="button" (click)="togglePassword()" class="tc-eye-btn">
            <span class="material-symbols-outlined" style="font-size:20px">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="tc-agree-row" style="margin:8px 0 20px;">
        <label style="display:flex;align-items:center;gap:12px;cursor:pointer;">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" style="display:none"/>
          <div class="tc-check" [class.tc-checked]="rememberMe" (click)="rememberMe = !rememberMe">
            <svg viewBox="0 0 12 10" style="width:12px;fill:none;stroke:#fff;stroke-width:2.5;" [style.opacity]="rememberMe ? 1 : 0">
              <polyline points="1.5,5 4.5,8.5 10.5,1.5"/>
            </svg>
          </div>
          <span class="tc-agree-text">Remember this device</span>
        </label>
      </div>

      @if (successBanner()) {
        <div class="tc-alert" style="background:#d4edda;border-color:#28a745;color:#155724;margin-bottom:16px;">
          <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
          {{ successBanner() }}
        </div>
      }

      <!-- Error -->
      @if (errorMessage()) {
        <div class="tc-alert tc-alert-err">
          <span class="material-symbols-outlined" style="font-size:18px">error</span>
          {{ errorMessage() }}
        </div>
      }

      <!-- Submit -->
      <button type="submit" class="tc-btn" [disabled]="loading() || !email || !password">
        @if (loading()) {
          <svg class="tc-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="width:20px;height:20px">
            <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
          Signing in...
        } @else {
          Sign In <span class="tc-btn-arrow">→</span>
        }
      </button>
    </form>

    <!-- Divider -->
    <div class="tc-divider">or</div>

    <!-- Sign up link -->
    <div class="tc-signin-row">
      Don't have an account?
      <a [routerLink]="['/signup']">Create an Account</a>
    </div>
  </div>

  <!-- Trust badges -->
  <div class="tc-badges">
    <div class="tc-badge"><div class="tc-badge-dot"></div> 256-bit SSL Encrypted</div>
    <div class="tc-badge"><div class="tc-badge-dot" style="animation-delay:.6s"></div> GDPR Compliant</div>
    <div class="tc-badge"><div class="tc-badge-dot" style="animation-delay:1.2s"></div> SOC 2 Certified</div>
  </div>

</div>
