<aside class="fixed left-0 top-0 h-screen w-64 bg-[#f2f4f6] border-r border-[#c3c6d7] shadow-sm z-40 hidden md:flex flex-col p-4 gap-2">
  <!-- Brand -->
  <div class="px-4 py-6">
    <span class="text-2xl font-bold text-[#004ac6]">TrustCom</span>
    <div class="mt-1">
      <p class="text-sm font-semibold text-[#434655]">{{ userName }}</p>
      <p class="text-xs font-semibold text-[#505f76]">Trust Score: {{ trustScore }}</p>
    </div>
  </div>

  <!-- Nav Links -->
  <nav class="flex flex-col gap-2 flex-grow">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#d0e1fb] text-[#54647a] font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-4 text-[#434655] px-4 py-2 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-lg transition-all"
      >
        <span class="material-symbols-outlined">{{ item.icon }}</span>
        <span class="text-sm font-semibold">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Create Committee Button -->
  <button class="bg-[#004ac6] text-white rounded-xl px-4 py-4 text-sm font-semibold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-2 mt-4">
    <span class="material-symbols-outlined">add</span>
    Create Committee
  </button>

  <!-- Bottom Links -->
  <div class="mt-auto border-t border-[#c3c6d7] pt-4 flex flex-col gap-2">
    <a href="#" class="flex items-center gap-4 text-[#434655] px-4 py-2 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-lg transition-all">
      <span class="material-symbols-outlined">settings</span>
      <span class="text-sm font-semibold">Settings</span>
    </a>
    <a href="#" class="flex items-center gap-4 text-[#434655] px-4 py-2 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-lg transition-all">
      <span class="material-symbols-outlined">help</span>
      <span class="text-sm font-semibold">Help</span>
    </a>
  </div>
</aside>
