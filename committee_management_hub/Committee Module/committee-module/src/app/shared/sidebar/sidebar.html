<aside class="fixed left-0 top-0 h-screen w-64 bg-[#f2f4f6] border-r border-[#c3c6d7] shadow-sm z-40 hidden md:flex flex-col p-4 gap-2">

  <!-- Brand + User -->
  <div class="px-4 py-5">
    <span class="text-2xl font-bold text-[#004ac6]">TrustCom</span>
    <div class="flex items-center gap-3 mt-3">
      <div class="w-9 h-9 rounded-full bg-[#004ac6] flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
        {{ initials() }}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-semibold text-[#191c1e] truncate">{{ displayName() }}</p>
        <p class="text-xs text-[#505f76]">Trust Score: {{ trustScore() }}</p>
      </div>
    </div>
  </div>

  <!-- Nav Links -->
  <nav class="flex flex-col gap-1 flex-grow">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#d0e1fb] !text-[#004ac6] font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 text-[#434655] px-4 py-2.5 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-xl transition-all text-sm font-semibold"
      >
        <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }

    <!-- Join Requests link — only shows when there are pending requests -->
    <a
      routerLink="/join-requests"
      routerLinkActive="bg-[#d0e1fb] !text-[#004ac6] font-bold"
      class="flex items-center gap-3 text-[#434655] px-4 py-2.5 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-xl transition-all text-sm font-semibold"
    >
      <span class="material-symbols-outlined text-[20px]">mark_email_unread</span>
      <span class="flex-1">Join Requests</span>
      @if (pendingCount() > 0) {
        <span class="bg-[#ba1a1a] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">
          {{ pendingCount() }}
        </span>
      }
    </a>
  </nav>

  <!-- Create Committee Button -->
  <button
    (click)="goToCreateCommittee()"
    class="bg-[#004ac6] text-white rounded-xl px-4 py-3 text-sm font-semibold shadow-sm hover:bg-[#2563eb] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
    <span class="material-symbols-outlined text-[20px]">add</span>
    Create Committee
  </button>

  <!-- Bottom Links -->
  <div class="border-t border-[#c3c6d7] pt-3 flex flex-col gap-1">
    <a href="#" class="flex items-center gap-3 text-[#434655] px-4 py-2.5 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-xl transition-all text-sm font-semibold">
      <span class="material-symbols-outlined text-[20px]">settings</span>
      Settings
    </a>
    <a href="#" class="flex items-center gap-3 text-[#434655] px-4 py-2.5 hover:text-[#191c1e] hover:bg-[#e6e8ea] rounded-xl transition-all text-sm font-semibold">
      <span class="material-symbols-outlined text-[20px]">help</span>
      Help
    </a>
    <button
      (click)="signOut()"
      class="flex items-center gap-3 text-[#ba1a1a] px-4 py-2.5 hover:bg-[#ffdad6] rounded-xl transition-all text-sm font-semibold w-full text-left mt-1">
      <span class="material-symbols-outlined text-[20px]">logout</span>
      Sign Out
    </button>
  </div>
</aside>
