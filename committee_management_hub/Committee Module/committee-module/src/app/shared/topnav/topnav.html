<header class="sticky top-0 z-50 bg-[#f7f9fb] border-b border-[#c3c6d7] shadow-sm h-16 flex justify-between items-center w-full px-6">

  <!-- Search -->
  <div class="flex items-center gap-4 w-full max-w-xl">
    <div class="relative w-full">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#434655]">search</span>
      <input
        [(ngModel)]="searchQuery"
        class="w-full pl-10 pr-4 py-2 bg-[#f2f4f6] border border-[#c3c6d7] rounded-xl focus:ring-2 focus:ring-[#2563eb] focus:border-[#004ac6] outline-none text-sm transition-all"
        [placeholder]="searchPlaceholder"
        type="text"
      />
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-3">

    <!-- Notifications -->
    <button
      (click)="notificationService.showNextPopup()"
      class="p-2 hover:bg-[#e6e8ea] rounded-full transition-colors relative">
      <span class="material-symbols-outlined text-[#434655]">notifications</span>
      @if (notificationService.unreadCount() > 0) {
        <span class="absolute top-1 right-1 min-w-[18px] h-[18px] bg-[#ba1a1a] rounded-full flex items-center justify-center">
          <span class="text-white text-[10px] font-bold px-1">{{ notificationService.unreadCount() }}</span>
        </span>
      }
    </button>

    <!-- User Menu -->
    <div class="relative">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center gap-2 p-1 pl-3 hover:bg-[#e6e8ea] rounded-full border border-[#c3c6d7] cursor-pointer transition-colors"
      >
        <span class="text-xs font-semibold text-[#191c1e] hidden lg:block max-w-[120px] truncate">{{ displayName() }}</span>
        <!-- Avatar: initials circle (no external image needed) -->
        <div class="w-8 h-8 rounded-full bg-[#004ac6] flex items-center justify-center text-white text-xs font-bold border-2 border-white flex-shrink-0">
          {{ initials() }}
        </div>
      </button>

      <!-- Dropdown -->
      @if (showUserMenu) {
        <div class="absolute right-0 top-12 w-64 bg-white rounded-2xl border border-[#c3c6d7] shadow-lg z-50 overflow-hidden">

          <!-- User Info Header -->
          <div class="px-4 py-4 bg-[#f2f4f6] border-b border-[#c3c6d7]">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-[#004ac6] flex items-center justify-center text-white text-sm font-bold flex-shrink-0">
                {{ initials() }}
              </div>
              <div class="min-w-0">
                <p class="text-sm font-semibold text-[#191c1e] truncate">{{ displayName() }}</p>
                <p class="text-xs text-[#737686] truncate">{{ email() }}</p>
              </div>
            </div>
          </div>

          <!-- Menu Items -->
          <div class="py-2">
            <a
              routerLink="/profile"
              (click)="showUserMenu = false"
              class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#191c1e] hover:bg-[#f2f4f6] transition-colors cursor-pointer"
            >
              <span class="material-symbols-outlined text-[20px] text-[#434655]">person</span>
              View Profile
            </a>
            <a
              routerLink="/dashboard"
              (click)="showUserMenu = false"
              class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#191c1e] hover:bg-[#f2f4f6] transition-colors cursor-pointer"
            >
              <span class="material-symbols-outlined text-[20px] text-[#434655]">dashboard</span>
              Dashboard
            </a>
            <a
              routerLink="/my-committees"
              (click)="showUserMenu = false"
              class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#191c1e] hover:bg-[#f2f4f6] transition-colors cursor-pointer"
            >
              <span class="material-symbols-outlined text-[20px] text-[#434655]">groups</span>
              My Committees
            </a>
          </div>

          <!-- Sign Out -->
          <div class="border-t border-[#c3c6d7] py-2">
            <button
              (click)="signOut()"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[#ba1a1a] hover:bg-[#ffdad6] transition-colors"
            >
              <span class="material-symbols-outlined text-[20px]">logout</span>
              Sign Out
            </button>
          </div>
        </div>

        <!-- Backdrop to close menu -->
        <div class="fixed inset-0 z-40" (click)="showUserMenu = false"></div>
      }
    </div>
  </div>
</header>
