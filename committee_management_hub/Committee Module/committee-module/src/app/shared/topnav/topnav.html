<header
  class="sticky top-0 z-50 bg-[#f7f9fb] border-b border-[#c3c6d7] shadow-sm h-16 flex justify-between items-center w-full px-6"
  [class.md:ml-64]="offsetLeft"
>
  <!-- Search -->
  <div class="flex items-center gap-4 w-full max-w-xl">
    <div class="relative w-full">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#434655]">search</span>
      <input
        [(ngModel)]="searchQuery"
        class="w-full pl-10 pr-4 py-2 bg-[#f2f4f6] border border-[#c3c6d7] rounded-xl focus:ring-2 focus:ring-[#2563eb] focus:border-[#004ac6] outline-none text-sm transition-all"
        [placeholder]="searchPlaceholder"
        type="text"
      />
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-4">
    <!-- Notifications -->
    <button class="p-2 hover:bg-[#e6e8ea] rounded-full transition-colors relative">
      <span class="material-symbols-outlined text-[#434655]">notifications</span>
      <span class="absolute top-2 right-2 w-2 h-2 bg-[#ba1a1a] rounded-full"></span>
    </button>

    <!-- User -->
    <div class="flex items-center gap-2 p-1 pl-2 hover:bg-[#e6e8ea] rounded-full border border-[#c3c6d7] cursor-pointer transition-colors">
      <span class="text-xs font-semibold text-[#191c1e] hidden lg:block">{{ userName }}</span>
      <img
        [src]="userAvatar"
        [alt]="userName"
        class="w-8 h-8 rounded-full border-2 border-white object-cover"
      />
    </div>
  </div>
</header>
